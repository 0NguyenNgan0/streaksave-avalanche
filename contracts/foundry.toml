[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 32
fail_on_revert = false

[fmt]
# Dependencies are vendored/installed code; do not reformat them or fail CI on their style.
ignore = ["lib/**", "node_modules/**"]
